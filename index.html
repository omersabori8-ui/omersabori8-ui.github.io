<!DOCTYPE html>

<head>

    <title>Mohammad Omar | Portfolio</title>
    <style>

        /* استایل برای عکس گواهینامه - چسبیده به بالا */

<body>

<img src="YOUR_IMAGE_FILE_NAME.png" alt="Certificate" class="certificate-img">

<div class="container">
    <section>
        <h2>درباره من</h2>
